
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Meu primeiro site</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            color: #222;
        }

        header {
            background: #5945dd;
            color: white;
            padding: 20px;
            text-align: center;
        }

        main {
            max-width: 900px;
            margin: 60px auto;
            padding: 20px;
            text-align: center;
        }

        h1 {
            font-size: 48px;
            margin-bottom: 20px;
        }

        p {
            font-size: 20px;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .botao {
            display: inline-block;
            padding: 14px 24px;
            background: #111;
            color: white;
            text-decoration: none;
            border-radius: 8px;
        }

        .botao:hover {
            background: #333;
        }

        footer {
            text-align: center;
            padding: 30px;
            color: #666;
        }
    </style>
</head>

<body>

    <header>
        <strong>Meu Site</strong>
    </header>

    <main>
        <h1>Olá, mundo! 🚀</h1>

        <p>
            Meu primeiro site está rodando no GitHub Pages.
        </p>

        <a href="game/startgame.html" class="botao">
            Testando aqui
        </a>
    </main>

    <footer>
        © 2026 - Meu Site
    </footer>

</body>
</html>
